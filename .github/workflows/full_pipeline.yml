name: Full supermarket collection and pipeline

on:
  workflow_dispatch:
  # Enable only after a successful full manual run:
  # schedule:
  #   - cron: '30 6 * * 1'
  #     timezone: 'Europe/Madrid'

permissions:
  contents: write

concurrency:
  group: supermarket-data-main
  cancel-in-progress: false

jobs:
  collect-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbclient nbformat

      - name: Verify Chrome availability
        run: |
          google-chrome --version || chromium --version
          python -c "import selenium; print('Selenium', selenium.__version__)"

      - name: Collect seven supermarkets into data/raw and data/history
        run: python scripts/run_full_collection.py

      - name: Rebuild the current catalogue and historical observations
        run: python -m src.pipeline.build

      - name: Recompute price changes for Trends
        run: python -m src.analysis.history

      - name: Validate pipeline and SQLite outputs
        run: python scripts/validate_pipeline_outputs.py

      - name: Commit RAW, history, normalized CSV and SQLite outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/raw data/history
          git add -- data/products_normalized.csv data/price_history_normalized.csv data/price_changes.csv
          git add -f -- data/supermarkets.db
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "Update supermarket RAW, history, and normalized prices"
          git push origin HEAD:main
