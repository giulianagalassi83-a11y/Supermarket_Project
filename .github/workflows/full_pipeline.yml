
name: Full supermarket collection and pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: '0 14 * * 4'

permissions:
  contents: read

concurrency:
  group: supermarket-data-main
  cancel-in-progress: false

jobs:
  collect:
    name: Collect ${{ matrix.collector }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        collector:
          - mercadona
          - bm_consum
          - alcampo
          - ahorramas
          - aldi

    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt nbclient nbformat

      - name: Check Chrome
        if: contains(fromJSON('["alcampo","ahorramas","aldi"]'), matrix.collector)
        run: |
          google-chrome --version || chromium --version

      - name: Run and validate collector
        run: python -m scripts.run_one_collector "${{ matrix.collector }}"

      - name: Upload RAW outputs for pipeline job
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.collector }}
          path: artifact_payload/
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  build-and-publish:
    name: Build, validate and publish
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt nbclient nbformat

      - name: Download five collector artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: downloaded_collectors
          merge-multiple: true

      - name: Verify and integrate new RAW data
        run: python -m scripts.validate_collector_artifacts

      - name: Rebuild normalized catalog and SQLite
        run: python -m src.pipeline.build

      - name: Recompute Trends
        run: python -m src.analysis.history

      - name: Validate pipeline outputs
        run: python scripts/validate_pipeline_outputs.py

      - name: Commit RAW, history and normalized outputs
        if: github.ref == 'refs/heads/main'
        run: |
          git diff --exit-code HEAD -- data/raw/dia_products_raw.csv ':(glob)data/history/dia/*_raw.csv'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/raw data/history
          git add -- data/products_normalized.csv
          git add -- data/price_history_normalized.csv
          git add -- data/price_changes.csv
          git add -f -- data/supermarkets.db

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update six supermarkets, normalized catalog and Trends"
          git push origin HEAD:main
