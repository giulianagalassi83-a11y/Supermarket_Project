name: Full supermarket collection and pipeline

on:
  workflow_dispatch:
  # Enable only after a complete successful manual run:
  # schedule:
  #   - cron: '30 6 * * 1'
  #     timezone: 'Europe/Madrid'

permissions:
  contents: read

concurrency:
  group: supermarket-data-main
  cancel-in-progress: false

jobs:
  collect:
    name: Collect ${{ matrix.collector }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        collector:
          - mercadona
          - bm_consum
          - alcampo
          - ahorramas
          - dia
          - aldi
    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbclient nbformat

      - name: Check Chrome
        if: contains(fromJSON('["alcampo","ahorramas","dia","aldi"]'), matrix.collector)
        run: google-chrome --version || chromium --version

      - name: Run and validate collector
        run: python -m scripts.run_one_collector "${{ matrix.collector }}"

      - name: Upload RAW outputs for the pipeline job
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.collector }}
          path: artifact_payload/
          if-no-files-found: error
          retention-days: 7

  build-and-publish:
    name: Build, validate and publish
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbclient nbformat

      - name: Download six collector artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: .
          merge-multiple: true

      - name: Verify complete RAW collection
        run: python -m scripts.validate_collector_artifacts

      - name: Rebuild normalized catalog and SQLite
        run: python -m src.pipeline.build

      - name: Recompute Trends
        run: python -m src.analysis.history

      - name: Validate pipeline outputs
        run: python scripts/validate_pipeline_outputs.py

      - name: Commit RAW, history and normalized outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/raw data/history
          git add -- data/products_normalized.csv data/price_history_normalized.csv data/price_changes.csv
          git add -f -- data/supermarkets.db
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update supermarket RAW, history and Trends"
          git push origin HEAD:main
