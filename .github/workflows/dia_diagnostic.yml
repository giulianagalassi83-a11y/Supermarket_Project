name: DIA diagnostic (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: python -m pip install selenium pandas beautifulsoup4 nbformat
      - name: Diagnose DIA search for leche
        run: python scripts/diagnose_dia.py
      - name: Upload DIA diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dia-diagnostics
          path: dia_diagnostics/
          if-no-files-found: warn
          retention-days: 7
