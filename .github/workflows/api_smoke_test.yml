name: API collection smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbclient

      - name: Test Mercadona, BM and Consum APIs without saving CSVs
        run: python scripts/run_api_smoke_test.py
